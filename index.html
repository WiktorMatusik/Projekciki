<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie do Systemu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
                    </svg>
                </div>
                <h2>Witaj ponownie</h2>
                <p>Wprowadź dane, aby przejść do swojego profilu</p>
            </div>

            <div id="alertMessage" class="alert hidden"></div>

            <form id="loginForm" novalidate>
                <div class="input-group">
                    <label for="username">Nazwa użytkownika</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="np. admin lub uzytkownik" autocomplete="username" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Hasło</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" id="togglePassword" class="toggle-btn" aria-label="Pokaż hasło">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Zaloguj się
                </button>
            </form>

            <div class="login-footer">
                <div class="badge-hint">Konto Admina: <strong>admin</strong> / <strong>admin123</strong></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
